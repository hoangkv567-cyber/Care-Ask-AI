# config/config.yaml
# LƯU Ý BẢO MẬT: KHÔNG ghi mật khẩu / API key trực tiếp vào đây nữa.
# Tất cả secrets được nạp từ file .env (xem .env.example) qua src/config_loader.py.

neo4j:
  uri: ""        # Lấy từ NEO4J_URI trong .env
  user: ""       # Lấy từ NEO4J_USER trong .env
  password: ""   # Lấy từ NEO4J_PASSWORD trong .env

qa:
  llm_model: "qwen2.5:7b"
  temperature: 0.0
  seed: 42
  top_p: 0.9

requesty:
  use_cloud: true    # TEXT LLM CHÍNH — Requesty.ai router (model 72B, mạnh hơn HF 7B). Fallback ollama local.
  api_key: ""        # Lấy từ REQUESTY_API_KEY trong .env
  model: "deepinfra/Qwen/Qwen2.5-72B-Instruct"

huggingface:
  use_cloud: false   # TEXT LLM tắt (đã chuyển Requesty). Token HF VẪN dùng cho VISION (xem mục 'vision').
  token: ""      # Lấy từ HUGGINGFACE_TOKEN trong .env
  model: "Qwen/Qwen2.5-7B-Instruct"


# (Đã bỏ SiliconFlow — hết số dư, không còn dùng cho text lẫn vision.)

# Mô hình phân tích ảnh vọng chẩn (lưỡi/mặt)
vision:
  provider: "huggingface"   # "huggingface" (Qwen3-VL qua HF router) | "requesty" (Qwen2.5-VL qua Requesty router) | "ollama" (LLaVA local)
  model: "Qwen/Qwen3-VL-30B-A3B-Instruct"        # HF router phục vụ bản 30B MoE (gần Qwen3-VL-32B nhất; 32B không có provider)
  classify_model: "Qwen/Qwen3-VL-30B-A3B-Instruct"   # HF không có bản 8B -> dùng luôn 30B cho gác cổng lưỡi/mặt
  # FALLBACK khi HuggingFace lỗi (mất mạng/hết quota): Requesty router -> LLaVA local. Cần
  # REQUESTY_VISION_API_KEY trong .env. Đổi provider:"requesty" để dùng model này làm CHÍNH.
  # LƯU Ý: 'novita/qwen/qwen2.5-vl-72b-instruct' (user chọn) đang lỗi 500 phía provider (2026-07-16)
  # -> dùng 'parasail/...' (CÙNG Qwen2.5-VL-72B, provider khác, đã test OK). Đổi lại novita khi nó hồi.
  fallback_model: "parasail/parasail-qwen25-vl-72b-instruct"
  # HF router hay 504 (quá tải) -> timeout THẤP để fail nhanh xuống fallback parasail (giây). Chỉ áp
  # cho client HF; parasail/Requesty vẫn giữ 120s (72B cần thời gian). Tăng nếu HF ổn định trở lại.
  hf_timeout: 20
  temperature: 0.0
  # Vọng chẩn CÓ CẤU TRÚC: VLM trả JSON theo schema -> map triệu chứng deterministic (bỏ bước LLM
  # đọc prose + regex vá ảo giác). Tự fallback về prose nếu VLM không trả JSON hợp lệ. Áp dụng cho
  # VLM Qwen3-VL/Qwen2.5-VL. Đặt false để về nguyên hành vi mô tả văn xuôi cũ.
  structured: true

# Model vision local — dùng khi vision.provider="ollama", và làm fallback khi cloud lỗi
ollama:
  model: "llava:7b"

dataset:
  csv_path: "data/Medicine_clean.csv"  # Có thể override bằng TCM_CSV_PATH trong .env

logging:
  level: "INFO"
